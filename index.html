<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardinal Youth Fiesta — Live Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bunting" id="bunting"></div>

<header class="site-header">
  <div class="brand">
    <span class="brand-crest">🛡️</span>
    <span>CARDINAL HSS<br>THRIKKAKARA</span>
  </div>
  <div class="tagline">Different Houses<br>Same Dream</div>
</header>

<div class="title-banner">
  <div class="ribbon">
    <span class="crown">👑</span>
    <h1><small>Cardinal</small>Youth Fiesta</h1>
    <span class="subline">Live Scoreboard</span>
  </div>
</div>

<div class="section-banner"><span>Overall Standings</span></div>

<main class="house-grid" id="houseGrid" aria-live="polite">
  <!-- house cards injected by app.js -->
</main>

<footer class="site-footer">
  Updated live during the festival · <a href="admin.html">Admin</a>
</footer>

<!-- Announcement overlay -->
<div class="announce-overlay" id="announceOverlay">
  <div class="announce-card" id="announceCard">
    <span class="announce-eyebrow">New Result</span>
    <div class="announce-medal" id="announceMedal">🥇</div>
    <h2 class="announce-name" id="announceName">Student Name</h2>
    <p class="announce-meta" id="announceMeta">Class · Programme</p>
    <span class="announce-house" id="announceHouse">🦁 Yellow House</span>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
